[project]
name = "blind-llm"
version = "0.1.0"
description = "Personal blind LLM comparison tool. Build your own model rankings."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = ["httpx>=0.27"]

[project.scripts]
blind = "blind:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
